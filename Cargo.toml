[package]
name = "xmrs"
version = "0.9.10"
edition = "2021"
description = "A library to edit SoundTracker data with pleasure "
license = "MIT"
authors = ["Sebastien Bechet"]
documentation = "https://docs.rs/xmrs"
repository = "https://codeberg.org/sbechet/xmrs"
readme = "README.md"

keywords = ["xm", "mod", "s3m", "it", "soundtracker"]
categories = ["multimedia::audio", "embedded", "no-std"]

[dependencies]
bincode = { version = "2.0", features = ["alloc", "derive", "serde"], default-features = false }
clap = { version = "4.5", optional = true, features = ["cargo", "derive"] }
num_enum = { version = "0.7", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde-big-array = "0.5"
# Float math backends for `no_std` builds (ignored when `std` is enabled).
num-traits = { version = "0.2.17", default-features = false, optional = true } # libm wrapper
micromath = { version = "2.1.0", optional = true }

[features]
# `std` is on by default: the common case is a desktop/server build that
# wants the standard library. Users targeting `no_std` opt out with
# `default-features = false` and pick a float math backend (`libm` or
# `micromath`). This matches the convention used by `serde`, `bincode`,
# `hashbrown`, etc.
default = ["std"]

# Enable the standard library. When on, `f32` inherent methods are used
# for float math and no extra math dependency is pulled in.
std = ["bincode/std", "num_enum/std", "serde/std"]

# `demo` gates the example binaries/tools. It is a convenience feature
# that also turns on `std` so that `--no-default-features --features demo`
# still builds.
demo = ["std", "clap", "import"]

# ---- Float math backends (only needed when `std` is disabled) ----
# Pick exactly one of `libm` or `micromath` in `no_std` builds.
libm = ["num-traits/libm"]
micromath = ["dep:micromath"]

# ---- Import features ----
import = []
import_sid = ["import"]

# ---- xorshift RNG widths (rand32 is always enabled) ----
rand8 = []
rand16 = []
rand64 = []


[lib]
name = "xmrs"
path = "src/lib.rs"

[[example]]
name = "xmrs"
required-features = ["demo"]

[[example]]
name = "xmi"
required-features = ["import"]

[[example]]
name = "sid"
required-features = ["import_sid", "std"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
