[package]
name = "xmrs"
version = "0.12.2"
edition = "2021"
description = "A library to edit SoundTracker data with pleasure "
license = "MIT"
authors = ["Sebastien Bechet"]
documentation = "https://docs.rs/xmrs"
repository = "https://codeberg.org/sbechet/xmrs"
readme = "README.md"

keywords = ["xm", "mod", "s3m", "it", "soundtracker"]
categories = ["multimedia::audio", "embedded", "no-std"]

[dependencies]
clap = { version = "4.5", optional = true, features = ["cargo", "derive"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[features]
# `std` and `import` are on by default: the common case is a
# desktop/server build that wants the standard library and all format
# importers. Users targeting `no_std` or wanting a smaller binary opt
# out with `default-features = false` and pick only what they need.
# This matches the convention used by `serde`, `bincode`, `hashbrown`,
# etc.
default = ["std", "import"]

# Enable the standard library. The crate compiles fully `no_std`
# without any extra math backend — every former `f32` site has
# been folded to integer Q-format arithmetic, including the LFO
# (`waveform.rs`), the IT importer's `c5_speed_to_finetune`
# (binary search via `linear_frequency_to_period`), and the
# pitch / period / frequency tables. `std` here only forwards
# the corresponding feature flag to dependencies that have one
# (and `bincode?/std` only fires if `bincode` was pulled in by
# an importer feature).
std = ["serde/std"]

# `demo` gates the example binaries/tools. It is a convenience feature
# that also turns on `std` and all importers so that
# `--no-default-features --features demo` still builds.
demo = ["std", "clap", "import"]

# Enable `f32 ↔ Q` conversions on every fixed-point and domain
# type in `crate::fixed`. Intended for the editor / desktop
# side; never enabled on the embedded build. Self-contained: it
# only uses `core`-stable `f32` operations, no math backend.
float-helpers = []

# ---- Historical-format importers ----
# All importers parse fixed-layout binary structs through the
# cursor-based [`crate::import::bin_reader`] helper — no third-party
# binary-parsing crate is involved.
#
# `import` is an umbrella for all importers. Downstreams that want a
# smaller binary can disable it and pick only the formats they need:
#   default-features = false, features = ["std", "import_xm"]
import = [
    "import_mod",
    "import_xm",
    "import_s3m",
    "import_it",
    "import_sid",
]
# ProTracker-style Amiga MOD. Shares effect-parsing code with XM
# (via `import::xm::mod_xm_effect`), which is pulled in as needed.
import_mod = []
# Fasttracker II XM.
import_xm  = []
# ScreamTracker 3 S3M.
import_s3m = []
# Impulse Tracker IT.
import_it  = []
# Commodore 64 SID (MOS6581).
import_sid = []

# ---- xorshift RNG widths (rand32 is always enabled) ----
rand8 = []
rand16 = []
rand64 = []


[dev-dependencies]
# Property-based testing for the EditCommand round-trip
# invariants. Default features dropped: we don't need `fork`
# (subprocess isolation per case, useful when tests can panic;
# ours don't), `timeout` (requires `fork`), or `bit-set` (faster
# shrinking via a `BitSet`, falls back to a slower path without).
# Keeping `std` only — it pulls in `regex-syntax` which is used
# by the `"[a-z]{1,8}"` name generators in `edit_proptest.rs`.
proptest = { version = "1", default-features = false, features = ["std"] }

[lib]
name = "xmrs"
path = "src/lib.rs"

[[example]]
name = "xmrs"
required-features = ["demo"]

[[example]]
name = "xmi"
# XI is an XM instrument file; only the XM importer is needed.
required-features = ["std", "import_xm"]

[[example]]
name = "sid"
required-features = ["std", "import_sid"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
